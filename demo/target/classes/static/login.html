<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

</head>
<body>
    <div><center>
    <h2>LOGIN FORM</h2>
     <form onsumbit="event.preventDefault()">
<label for="Email">Email</label><input type="email" id="email" placeholder="Enter email"><br><br>
<label for="Password">Password</label><input type="password" id="password" placeholder="Enter password"><br><br>
<button onclick="loginuser()" class="btn btn-primary">Login</button>

    </form>
    </center>
    </div>
<script>
function loginuser(){

const logindata={
 
    email:document.getElementById("email").value,
    password: document.getElementById("password").value
    
};

fetch("http://localhost:8081/api/login", {
    method:"POST",
    headers:{"Content-Type" : "application/json"},
    body:JSON.stringify(logindata)
})

.then(response => response.text())
.then(data=>{
    alert(data);
    console.log(data);
})

.catch(error=>{
    console.error(error);
})



}


</script>


</body>
</html>
