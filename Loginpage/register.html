<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="Style.css">
</head>

<body>
  

 <main class="page">
    <section class="panel">
    
      <h1>Register</h1>
 <form id="registerForm" onsubmit="registeruser(event)">
        <input id="name" type="text" placeholder="Name" required><br>
        <input id="email" type="email" placeholder="Email" required><br>
        <input id="password" type="password" placeholder="Password" required><br>
        <button id="registerButton" type="submit">Register</button>
     </form>

      <div id="status" class="status" hidden></div>
      <a class="link-button text-link" href="login.html">Back to Login</a>
</section>
  </main>
      
    <script>
    
   const API_BASE_URL = "http://localhost:8081/api";
   const registerButton=document.getElementById("registerButton");
   const statusBox=document.getElementById("status");


 function showStatus(message){
statusBox.textContent=message;
statusBox.hidden=false;

}

 async function registeruser(event) {
    
  
	event.preventDefault();
    registerButton.disabled=true;
    showStatus("Registering...");

const user={
 name: document.getElementById("name").value.trim(),
 email:document.getElementById("email").value.trim(),
 password:document.getElementById("password").value,

};
try{

const response=await fetch(`${API_BASE_URL}/register`, {

method: "POST",
headers: {"Content-Type":"application/json"},
body:JSON.stringify(user)

});

const message =await response.text();
if(!response.ok){
    throw new Error(message || "Registered Failed");
}

showStatus(message ||"Register Successful");
setTimeout(function redirectlogin(){
    window.location.href="login.html";},700);}

catch(error){
    showStatus(error.message || "Registered failed");
}

finally{
  registerbutton.disabled=false;

}
 }
    </script>
    
</body>
</html>
