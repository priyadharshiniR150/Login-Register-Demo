<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="Style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  

 <main class="page">
    <section class="panel">
    
      <h1>Register</h1>
 <form id="registerForm" onsubmit="registeruser(event)"  novalidate>
        <input id="name" type="text" placeholder="Name" required><br>
        <input id="mobile" type="text" placeholder="Mobile Number" maxlength="10" required><br>
        <input id="email" type="email" placeholder="Email" required><br>
        <input id="password" type="password" placeholder="Password" required><br>
        <button id="registerButton" type="submit">Register</button>
     </form>

      <div id="status" class="status text-danger fw-bold" hidden ></div>
      <a class="link-button text-link" href="login.html">Back to Login</a>
</section>

  </main>
      
    <script>

   const API_BASE_URL = "http://localhost:8081/api";
   const registerButton=document.getElementById("registerButton");
   const statusBox=document.getElementById("status");
   const emailInput = document.getElementById("email");


 function showStatus (message){
statusBox.textContent=message;
statusBox.hidden=false;

}

 async function registeruser(event) {
    
  
	event.preventDefault();
    registerButton.disabled=true;
    showStatus("Registering...");

const name = document.getElementById("name").value.trim();
const email = document.getElementById("email").value.trim();
const mobile = document.getElementById("mobile").value.trim();
const password = document.getElementById("password").value;

const user = {
    name: name,
    email: email,
    mobile: mobile,
    password: password
};
if(name === "" && email === "" && password === "" ){
    alert("Name, Email and Password are required");
    registerButton.disabled = false;
    return;
}

if(name==""){

 showStatus ("Name is Required");
 registerButton.disabled=false;
 return 
}
if(email === ""){
  emailInput.classList.add("is-invalid");
    showStatus("Email is required");
    registerButton.disabled = false;
    return;
}

if(!email.includes("@gmail.com")){
   emailInput.classList.add("is-invalid");
    showStatus("Email must contain @gmail.com");
    registerButton.disabled = false;
    return;
}
emailInput.classList.remove("is-invalid");
document.getElementById("email").addEventListener("input", function () {
    this.classList.remove("is-invalid");
});
const isMobile = /^\d{10}$/.test(email);
if (mobile === "") {
    showStatus("Mobile Number is required");
    registerButton.disabled = false;
    return;
}

const mobilePattern = /^\d{10}$/;

if (!mobilePattern.test(mobile)) {
    showStatus("Mobile Number must be exactly 10 digits");
    registerButton.disabled = false;
    return;
}

if(password === ""){
    showStatus("Password is required");
    registerButton.disabled = false;
    return;
}
const passwordPattern= /^(?=.*[@$!%*?&#]).{8,}$/;
if(!passwordPattern.test(password)){

   showStatus("Password must be at least 8 characters and contain a special character (@, $, #, !, etc.)");
    registerButton.disabled = false;
    return;
}

try{

const response=await fetch(`${API_BASE_URL}/register`, {

method: "POST",
headers: {"Content-Type":"application/json"},
body:JSON.stringify(user)

});

console.log("Status:", response.status);
const message =await response.text();
if(!response.ok){
    throw new Error(message || "Registered Failed");
} 

showStatus(message ||"Register Successful");
setTimeout(function redirectlogin(){
    window.location.href="login.html";},700);}

catch(error){
    showStatus(error.message || "Registered failed");
}

finally{
  registerButton.disabled=false;

}
}
 
    </script>
    
</body>
</html>
