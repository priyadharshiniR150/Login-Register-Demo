<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
    
    <main class="page">
    <section class="panel">
  
      <h1>Login</h1>

      <form id="loginForm" onsubmit="loginuser(event)">
        <input id="email" type="text" placeholder="Email or Mobile Number" ><br>
        <input id="password" type="password" placeholder="Password" required><br>
        <button id="loginButton" type="submit">Login</button><br>
        <a href="forgott.html">Forgot Password</a>
      </form>

      <div id="status" class="status" hidden></div>
      <a class="link-button text-link" href="register.html">Create an account</a>
    </section>
  </main>
  
<script>

const API_BASE_URL="http://localhost:8081/api";
const loginButton =document.getElementById("loginButton");
const statusBox=document.getElementById("status");



function showStatus(message){

    statusBox.textContent=message;
    statusBox.hidden= false;
}

async function loginuser(event){
	event.preventDefault();

      const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;

    console.log("Input:", email);
console.log("Length:", email.length);

    const logindata = {
    email: email,
    password: password
};

    loginButton.disabled = true;
    showStatus("Logging in");
   

 if (email=="") {
        showStatus("Email or Mobile Number is Required");
        loginButton.disabled = false;
        return;
    }
const input = email.trim();

const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input);
const isMobile = /^\d{10}$/.test(input);
const inputField = document.getElementById("email");



inputField.addEventListener("input", function () {
    let value = this.value;

 
   
     if (/^\d+$/.test(value)) {
        this.value = value.slice(0, 10);
    }
});
if (!isEmail && !isMobile) {
    showStatus("Enter a valid Email or 10-digit Mobile Number");
    loginButton.disabled = false;
    return;
}


    if (password=="") {
        showStatus("Password is Required");
        loginButton.disabled = false;
        return;
    }
     
    
try{
     const response=await fetch (`${API_BASE_URL}/login`, {
    method:"POST",
    headers:{"Content-Type" : "application/json"},
    body:JSON.stringify(logindata)
});

const message=await response.text();
 if (response.status === 401) {
            showStatus(message);
            return;
        }

        if (!response.ok) {
            showStatus(message || "Login failed");
            return;
        }
localStorage.setItem("authToken", message);
window.location.href="dashboard.html";   
}
catch(error){
    showStatus(error.message || "login failed");
}
finally{
    loginButton.disabled=false;
}
}


</script>


</body>
</html>
