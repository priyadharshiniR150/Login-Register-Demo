<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
    
    <main class="page">
    <section class="panel">
  
      <h1>Login</h1>

      <form id="loginForm" onsubmit="loginuser(event)">
        <input id="email" type="email" placeholder="Email" required><br>
        <input id="password" type="password" placeholder="Password" required><br>
        <button id="loginButton" type="submit">Login</button><br>
      </form>

      <div id="status" class="status" hidden></div>
      <a class="link-button text-link" href="register.html">Create an account</a>
    </section>
  </main>
  
<script>

const API_BASE_URL="http://localhost:8081/api";
const loginButton =document.getElementById("loginButton");
const statusBox=document.getElementById("status");


function showStatus(message){

    statusBox.textContent=message;
    statusBox.hidden= false;
}

async function loginuser(event){
	event.preventDefault();
    loginButton.disabled = true;
    showStatus("Logging in")

const logindata={
 
    email:document.getElementById("email").value.trim(),
    password: document.getElementById("password").value,
    
};
try{
     const response=await fetch (`${API_BASE_URL}/login`, {
    method:"POST",
    headers:{"Content-Type" : "application/json"},
    body:JSON.stringify(logindata)
});

const token=await response.text();
if(!response.ok || token.startsWith ("Invalid ")  || token.includes("not found")){

    throw new Error (token || "Invalid email or password");

}
localStorage.setItem("authToken", token);
window.location.href="dashboard.html";   
}
catch(error){
    showStatus(error.message || "login failed");
}
finally{
    loginButton.disabled=false;
}
}


</script>


</body>
</html>
